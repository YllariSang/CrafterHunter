plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "crafterhunter" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Headless check uses the installed game classes, not copied model geometry.
tasks.register('testBakedPlayer', JavaExec) {
    dependsOn tasks.named('compileBakedPlayerTest')
    classpath = sourceSets.client.compileClasspath + sourceSets.client.output + files(layout.buildDirectory.dir('player-test'))
    mainClass = 'BakedPlayerModelTest'
    if (project.hasProperty('playerEvidence')) args project.property('playerEvidence')
}
tasks.register('compileBakedPlayerTest', JavaCompile) {
    source = files('tests/BakedPlayerModelTest.java')
    dependsOn tasks.named('compileClientJava')
    classpath = sourceSets.client.compileClasspath + sourceSets.client.output
    destinationDirectory = layout.buildDirectory.dir('player-test')
}
